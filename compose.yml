services:
  identity:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set a local demo admin password}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:?Set a local demo client secret}
    volumes:
      - ./identity/realm.json:/opt/keycloak/data/import/realm.json:ro

